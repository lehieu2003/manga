name: manga-data-engineering

services:
  postgres-source:
    image: postgres:16-alpine
    container_name: manga-de-postgres-source
    environment:
      POSTGRES_DB: ${SOURCE_DB_NAME:-manga_source}
      POSTGRES_USER: ${SOURCE_DB_USER:-manga_de}
      POSTGRES_PASSWORD: ${SOURCE_DB_PASSWORD:-manga_de}
    ports:
      - "${SOURCE_DB_HOST_PORT:-15432}:5432"
    volumes:
      - postgres_source_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - manga_de

  kafka:
    image: apache/kafka:3.7.0
    container_name: manga-de-kafka
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:${KAFKA_EXTERNAL_PORT:-29092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
    ports:
      - "${KAFKA_EXTERNAL_PORT:-29092}:29092"
    volumes:
      - kafka_data:/tmp/kraft-combined-logs
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - manga_de

  kafka-init:
    image: apache/kafka:3.7.0
    container_name: manga-de-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_TOPIC_USER_EVENTS: ${KAFKA_TOPIC_USER_EVENTS:-manga.user_events}
    command:
      - /bin/bash
      - -lc
      - |
        /opt/kafka/bin/kafka-topics.sh \
          --bootstrap-server kafka:9092 \
          --create \
          --if-not-exists \
          --topic "$${KAFKA_TOPIC_USER_EVENTS}" \
          --partitions 3 \
          --replication-factor 1
    networks:
      - manga_de

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    container_name: manga-de-kafka-ui
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_CLUSTERS_0_NAME: manga-data-engineering
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      DYNAMIC_CONFIG_ENABLED: "false"
    ports:
      - "${KAFKA_UI_PORT:-18082}:8080"
    networks:
      - manga_de

  spark-master:
    image: apache/spark:3.5.5
    container_name: manga-de-spark-master
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.master.Master", "-h", "spark-master"]
    ports:
      - "${SPARK_MASTER_UI_PORT:-18080}:8080"
      - "${SPARK_MASTER_CLUSTER_PORT:-17077}:7077"
    volumes:
      - ./spark/jobs:/opt/manga/jobs
      - ./spark/conf:/opt/manga/conf
      - ./dashboard/data/gold:/opt/manga/dashboard/data/gold
    networks:
      - manga_de

  spark-worker:
    image: apache/spark:3.5.5
    container_name: manga-de-spark-worker
    depends_on:
      - spark-master
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.worker.Worker", "spark://spark-master:7077", "-m", "2G", "-c", "2"]
    ports:
      - "${SPARK_WORKER_UI_PORT:-18081}:8081"
    volumes:
      - ./spark/jobs:/opt/manga/jobs
      - ./spark/conf:/opt/manga/conf
      - ./dashboard/data/gold:/opt/manga/dashboard/data/gold
    networks:
      - manga_de

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: manga-de-minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    command: server /data --console-address ":9001"
    ports:
      - "${MINIO_API_PORT:-19000}:9000"
      - "${MINIO_CONSOLE_PORT:-19001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - manga_de

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    container_name: manga-de-minio-init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MINIO_BUCKET: ${MINIO_BUCKET:-manga-analytics}
    entrypoint:
      - /bin/sh
      - -c
      - |
        mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"
        mc mb --ignore-existing "local/$${MINIO_BUCKET}"
        mc anonymous set none "local/$${MINIO_BUCKET}"
    networks:
      - manga_de

networks:
  manga_de:
    name: manga_de

volumes:
  postgres_source_data:
  kafka_data:
  minio_data:
